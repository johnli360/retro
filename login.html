    <body>
        <h1 id="board_id"></h1>

        <input id="username_input" style="display:block; width:30ch; box-sizing: border-box" type="text" placeholder="username">
        <button id="join" type="button">join</button>

        <div class="container" id="cols">

        <script>

            async function validate_login(user) {
                const response = await fetch(`/validate_login/${user}`);
                //const board = await response.json();
                //return board;
                return response.ok;
            };

            async function main() {

                const username_input = document.querySelector("#username_input");
                //const username_display = document.querySelector("#username_display");
                const join_btn = document.querySelector("#join");

                async function login() {
                    console.log("login");
                    const user = username_input.value;
                    if (user && user === '') {
                      return;
                    }
                    //window.location.href = `/validate_login/${user}`;

                    const valid = await validate_login(user);
                    console.log("valid login: " + valid);
                    console.log("cookie: " + document.cookie);
                    document.cookie = `SESSION=${user}; SameSite=Strict;`;
                    if (valid) {
                        window.location.href = '/boards';
                    }
                }

                join_btn.addEventListener('click', login);
            }
            main().catch(err => console.log("main err: " + err));
        </script>
    </body>
